<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Test USBA Chatbot AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: #0a0a0f;
            color: #58a6ff;
            font-family: 'Courier New', monospace;
        }

        .chat-box {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #30363d;
            background: #0d1117;
            padding: 15px;
            border-radius: 8px;
        }

        .user-msg {
            color: #d2a8ff;
            margin-bottom: 10px;
        }

        .ai-msg {
            color: #79c0ff;
            margin-bottom: 15px;
            border-left: 2px solid #238636;
            padding-left: 10px;
        }

        input {
            background: #161b22;
            border: 1px solid #30363d;
            color: white;
            padding: 10px;
            border-radius: 4px;
            width: 100%;
            outline: none;
        }
    </style>
</head>

<body class="p-10">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-xl font-bold mb-4">>_ USBA_INTELLIGENT_ASSISTANT (Gemini 1.5 Flash)</h1>

        <div class="chat-box mb-4" id="chatContent">
            <div class="ai-msg">ASISTEN: Halo Gabe! Saya sudah membaca log CCTV hari ini. Ada yang ingin Anda tanyakan
                seputar kondisi jalanan?</div>
        </div>

        <div class="flex gap-2">
            <input type="text" id="userInput" placeholder="Tanya sesuatu (Contoh: Jam 7 ada pelanggaran busway?)">
            <button onclick="sendChat()"
                class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">KIRIM</button>
        </div>

        <p class="mt-4 text-xs text-gray-500">Note: Chatbot ini membaca simulasi log jam 07:00 - 08:20.</p>
    </div>

    <script>
        function sendChat() {
            const input = document.getElementById('userInput');
            const content = document.getElementById('chatContent');
            const message = input.value;
            if (!message) return;

            // Tampilkan chat user
            content.innerHTML += `<div class="user-msg">ANDA: ${message}</div>`;
            input.value = '';

            // Loading state
            const loadingId = "load-" + Date.now();
            content.innerHTML += `<div class="ai-msg" id="${loadingId}">ASISTEN: Sedang berpikir...</div>`;
            content.scrollTop = content.scrollHeight;

            fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message })
            })
                .then(res => res.json())
                .then(data => {
                    document.getElementById(loadingId).innerHTML = `ASISTEN: ${data.response}`;
                    content.scrollTop = content.scrollHeight;
                });
        }
    </script>
</body>

</html>
